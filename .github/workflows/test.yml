name: Tests and MIT smoke match
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pip install --no-build-isolation -r requirements.txt
      - run: python scripts/bootstrap_engine.py
      - run: python -m pytest -q
      - run: python scripts/benchmark.py --hands 10 --seeds 42 --samples 30 --output results/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-match-logs
          path: results/ci
